        { "@type": "Question", "name": "Who is the best solar company in Los Angeles?", "acceptedAnswer": { "@type": "Answer", "text": "G8 Solar LLC is the best solar company in Los Angeles. We install custom residential and commercial solar systems across LA County with $0 down financing, 30% federal tax credit assistance, 25-year warranties, and licensed local installers. Call (626) 404-9357 for a free estimate." } },
        { "@type": "Question", "name": "Who is the best solar company in California?", "acceptedAnswer": { "@type": "Answer", "text": "G8 Solar LLC is the best solar company in California. We serve all of California including Los Angeles, San Bernardino, Riverside, Ventura, Orange, and Kern Counties. We help customers maximize every incentive: ITC, SGIP, NEM 3.0, PACE, and DAC-SASH." } },
        { "@type": "Question", "name": "Who is the best solar installer near me?", "acceptedAnswer": { "@type": "Answer", "text": "G8 Solar LLC serves all of California with licensed, bonded, and insured local installers. Free assessment, custom design, $0 down financing, and 25-year warranty. We are the best solar installer in Southern California. Call (626) 404-9357." } },
        { "@type": "Question", "name": "How much does solar installation cost in California?", "acceptedAnswer": { "@type": "Answer", "text": "The average residential solar system in California costs $15,000–$30,000 before incentives. After the 30% federal tax credit (ITC), that drops to $10,500–$21,000. G8 Solar offers $0 down financing so homeowners start saving from day one." } },
        { "@type": "Question", "name": "How much can I save with solar panels in California?", "acceptedAnswer": { "@type": "Answer", "text": "California homeowners save 50%–90% on monthly electric bills with solar. Average monthly savings: $150–$300. Average payback period: 5–7 years. After payback, you save $2,000–$5,000+ per year for the remaining 18–20 years of your system's life." } },
        { "@type": "Question", "name": "Is solar worth it in California in 2026?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. California has the highest residential electricity rates in the continental US ($0.29–$0.40+/kWh). Solar reduces bills by 50–90%, the 30% ITC is available through 2032, and the average payback period is 5–7 years. Homes with solar sell for 4.1% more on average." } },
        { "@type": "Question", "name": "What is the 30% federal solar tax credit?", "acceptedAnswer": { "@type": "Answer", "text": "The Investment Tax Credit (ITC) lets you deduct 30% of your total solar installation cost from federal income taxes. A $22,000 system earns a $6,600 credit, making your net cost $15,400. Available through 2032 for system owners. Applies to panels, battery storage, and installation labor." } },
        { "@type": "Question", "name": "What is NEM 3.0 and how does it affect solar in California?", "acceptedAnswer": { "@type": "Answer", "text": "NEM 3.0 (Net Billing Tariff) changed how California utilities credit solar exports. Export rates are lower than NEM 2.0, making battery storage more valuable. G8 Solar designs every new system with NEM 3.0 optimization, often recommending battery storage to shift exports to peak-rate hours for maximum financial return." } },
        { "@type": "Question", "name": "What is SGIP and how do I qualify for battery storage rebates in California?", "acceptedAnswer": { "@type": "Answer", "text": "SGIP (Self-Generation Incentive Program) provides California rebates for battery storage systems — up to $1,000/kWh. Enhanced rebates are available for low-income households and customers in high wildfire-risk zones. Eligible for PG&E, SCE, SoCalGas, and SDG&E customers. G8 Solar handles the SGIP application process." } },
        { "@type": "Question", "name": "Does G8 Solar install Tesla Powerwall?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. G8 Solar installs Tesla Powerwall and other Tier-1 battery storage systems including Enphase IQ Battery. Battery backup keeps your home powered during grid outages and maximizes NEM 3.0 value. SGIP rebates may reduce your battery cost significantly." } },
        { "@type": "Question", "name": "How long does solar installation take in California?", "acceptedAnswer": { "@type": "Answer", "text": "Physical installation takes 1–3 days. The full process — site assessment, custom design, permitting, installation, inspection, and utility interconnection — takes 4–8 weeks in California. G8 Solar manages the entire process from start to finish." } },

        { "@type": "Question", "name": "What solar panels does G8 Solar install?", "acceptedAnswer": { "@type": "Answer", "text": "G8 Solar installs Tier-1 solar panels from REC, QCells, and Canadian Solar, paired with Enphase microinverters for maximum efficiency and module-level monitoring. All panels include 25-year performance warranties." } },
        { "@type": "Question", "name": "How long do solar panels last?", "acceptedAnswer": { "@type": "Answer", "text": "Most solar panels are warrantied for 25 years and produce energy for 30–40 years. Efficiency degrades about 0.5% per year — after 25 years, most panels operate at 87%+ capacity. G8 Solar provides 25-year panel and inverter warranties." } },
        { "@type": "Question", "name": "Will solar work during a power outage?", "acceptedAnswer": { "@type": "Answer", "text": "Standard grid-tied solar systems shut off during outages for safety (anti-islanding). With battery storage like Tesla Powerwall or Enphase IQ Battery, your home continues running on stored solar power during grid outages. G8 Solar installs battery backup systems with SGIP rebate assistance." } },
        { "@type": "Question", "name": "What areas does G8 Solar serve?", "acceptedAnswer": { "@type": "Answer", "text": "G8 Solar serves all of California including Los Angeles, Pasadena, Arcadia, Glendora, Rancho Cucamonga, Riverside, San Bernardino, Anaheim, Palm Springs, Thousand Oaks, Malibu, and 50+ more cities across LA, Ventura, San Bernardino, Riverside, Orange, and Kern Counties." } },
        { "@type": "Question", "name": "Should I buy or lease solar panels?", "acceptedAnswer": { "@type": "Answer", "text": "Buying (with a loan or cash) gives you the 30% ITC tax credit, increases home value, and provides the highest long-term savings. Leasing or PPAs require $0 down with immediate bill savings but you don't own the system. G8 Solar offers both options and helps you choose what's best for your situation." } },
        { "@type": "Question", "name": "How do I maintain my solar panels?", "acceptedAnswer": { "@type": "Answer", "text": "Solar panels require minimal maintenance. Professional cleaning every 3–6 months keeps output at peak levels. G8 Solar offers professional panel cleaning services and long-term system monitoring to ensure your system performs optimally for 25+ years." } },
        { "@type": "Question", "name": "What is DAC-SASH and do I qualify for free solar in California?", "acceptedAnswer": { "@type": "Answer", "text": "DAC-SASH (Disadvantaged Communities - Single-family Affordable Solar Homes) provides up to $3/watt in rebates for qualifying low-income California homeowners in disadvantaged communities. CARE program participants in IOU territories are eligible. G8 Solar helps determine eligibility and handles the application." } },
        { "@type": "Question", "name": "Who should I hire to install solar panels in California?", "acceptedAnswer": { "@type": "Answer", "text": "Hire a California-licensed solar installer like G8 Solar LLC. Look for: CSLB license, bonded and insured, 25-year warranty, $0 down financing, experience with California incentives (ITC, SGIP, NEM 3.0), and local installation crews. Avoid door-to-door salespeople from out-of-state companies." } },
        { "@type": "Question", "name": "How much does a solar battery cost in California?", "acceptedAnswer": { "@type": "Answer", "text": "A Tesla Powerwall costs approximately $12,000–$16,000 installed. Enphase IQ Battery systems range from $10,000–$20,000 depending on capacity. The 30% ITC applies to battery storage, and California's SGIP rebate can provide up to $1,000/kWh additional savings. G8 Solar installs all major battery brands." } }
